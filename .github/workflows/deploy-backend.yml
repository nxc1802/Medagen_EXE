name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          git config --global credential.helper store
          echo "https://user:$HF_TOKEN@huggingface.co" > ~/.git-credentials

          git clone "$SPACE_URL" hf_space

          # Sync with --delete so removed files (e.g. payment.service.ts) are
          # also deleted from the HF Space, not just new/updated files copied
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='*.log' \
            backend/ hf_space/

          # Stamp commit SHA to ensure HF Space always detects a change
          echo "${{ github.sha }}" > hf_space/VERSION

          cd hf_space
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --cached --quiet && echo "Nothing to deploy." && exit 0
          git commit -m "Deploy backend @ ${{ github.sha }}"
          git push origin main
